# Local MIS hostname; the application remains on its existing loopback server.
<IfModule !proxy_module>
    LoadModule proxy_module /opt/homebrew/opt/httpd/lib/httpd/modules/mod_proxy.so
</IfModule>
<IfModule !proxy_http_module>
    LoadModule proxy_http_module /opt/homebrew/opt/httpd/lib/httpd/modules/mod_proxy_http.so
</IfModule>
<VirtualHost *:80>
    ServerName mis.badmaal.test
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8093/
    ProxyPassReverse / http://127.0.0.1:8093/
    <Location />
        Require local
    </Location>
    ErrorLog "/opt/homebrew/var/log/httpd/mis-badmaal-error.log"
    CustomLog "/opt/homebrew/var/log/httpd/mis-badmaal-access.log" common
</VirtualHost>
